name: FibonacciCamera
options:
  bundleIdPrefix: com.leisuresuitlissy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  FibonacciCamera:
    type: application
    platform: iOS
    sources:
      - FibonacciCamera
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leisuresuitlissy.fibonaccicamera
        PRODUCT_NAME: FibonacciCamera
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FibonacciCamera/Info.plist
      properties:
        CFBundleDisplayName: Fibonacci
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Fibonacci Camera uses the camera to take photos with composition guides.
        NSPhotoLibraryAddUsageDescription: Photos you take, and every copy you make, are saved to your library. Originals are never changed.
