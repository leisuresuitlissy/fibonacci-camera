name: iOS project

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate

      # Compile for real iPhones without signing: proves the Swift and Metal build before it reaches the Mac.
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project FibonacciCamera.xcodeproj -scheme FibonacciCamera -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          xcodebuild -project FibonacciCamera.xcodeproj -scheme FibonacciCamera -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build -quiet

      # An unsigned app for Sideloadly (or similar), which signs it with a free Apple ID — no Xcode needed on the Mac.
      - name: Build the IPA (Release, unsigned)
        working-directory: ios
        run: |
          xcodebuild -project FibonacciCamera.xcodeproj -scheme FibonacciCamera -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FibonacciCamera.app Payload/
          zip -qry ../fibonacci-camera.ipa Payload
          rm -rf Payload

      # The Simulator build compiles the demo-camera code that only exists there.
      - name: Build for the Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project FibonacciCamera.xcodeproj -scheme FibonacciCamera -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          xcodebuild -project FibonacciCamera.xcodeproj -scheme FibonacciCamera -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build -quiet

      # Run it: boot a Simulator, launch a few scripted screens, keep screenshots and console output.
      - name: Smoke-test in the Simulator
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/FibonacciCamera.app
          mkdir -p ../sim-check
          for shot in camera art double editor; do
            xcrun simctl terminate "$UDID" com.leisuresuitlissy.fibonaccicamera 2>/dev/null || true
            xcrun simctl launch --stdout="$PWD/../sim-check/$shot.log" --stderr="$PWD/../sim-check/$shot.err" "$UDID" com.leisuresuitlissy.fibonaccicamera -fibShot $shot
            sleep 12
            xcrun simctl io "$UDID" screenshot "../sim-check/$shot.png"
          done
          rm -rf build-sim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-check
          path: sim-check

      - name: Package the project
        run: |
          rm -rf ios/build
          cp -R ios "Fibonacci Camera iOS"
          echo "Build ${{ github.run_number }}" > "Fibonacci Camera iOS/BUILD.txt"
          zip -qr fibonacci-camera-ios.zip "Fibonacci Camera iOS"

      - name: Publish to the ios-latest release
        uses: ncipollo/release-action@v1
        with:
          tag: ios-latest
          commit: ${{ github.sha }}
          name: Fibonacci Camera — iOS project (latest)
          body: |
            Build ${{ github.run_number }} · built from ${{ github.sha }}.
            No Xcode: drop fibonacci-camera.ipa into Sideloadly with your Apple ID and the iPhone plugged in.
            With Xcode: open FibonacciCamera.xcodeproj, choose your Apple ID as the Team, plug in the iPhone, press Run.
          artifacts: fibonacci-camera-ios.zip,fibonacci-camera.ipa
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: false
