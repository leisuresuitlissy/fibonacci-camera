name: Look lab
# Renders every look at its default and each control's extremes on fixed fixtures, through the same
# Art.render path saved photos take, on an emulator. For tuning only: nothing is published.
on:
  push:
    paths: ['.github/looklab/**', '.github/workflows/looklab.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        working-directory: android
        run: gradle assembleDirectRelease --stacktrace
      - name: Fixtures and render list
        run: |
          python3 -m pip install --quiet pillow numpy
          mkdir -p lab
          python3 .github/looklab/make_desk.py lab/desk.png
          for i in $(seq -w 1 24); do curl -fsSL --max-time 30 "http://r0k.us/graphics/kodak/kodak/kodim$i.png" -o "lab/k$i.png" || rm -f "lab/k$i.png"; done
          python3 .github/looklab/prep.py lab
          python3 .github/looklab/spec.py lab > lab/spec.txt
          ls lab; wc -l lab/spec.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/looklab/run.sh android/app/build/outputs/apk/direct/release/app-direct-release.apk lab out
      - name: Contact sheets
        run: |
          python3 .github/looklab/sheets.py out lab sheets
          cd sheets && zip -q ../looklab-sheets.zip *.jpg && cd ..
          mkdir -p keep && cp out/*__desk__def.jpg out/*__deskbig__def.jpg keep/ 2>/dev/null || true
          cd keep && zip -q ../looklab-full.zip *.jpg && cd ..
      - uses: ncipollo/release-action@v1
        with:
          tag: looklab
          commit: ${{ github.sha }}
          name: Look lab renders (not a release)
          body: Look lab contact sheets for ${{ github.sha }}.
          artifacts: looklab-sheets.zip,looklab-full.zip
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: true
          makeLatest: false
